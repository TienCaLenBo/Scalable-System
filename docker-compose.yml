services:
  # --- DATABASE MASTER ---
  pg-master:
    image: bitnami/postgresql:latest
    environment:
      - POSTGRESQL_REPLICATION_MODE=master
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      - POSTGRESQL_USERNAME=myuser
      - POSTGRESQL_PASSWORD=mypassword
      - POSTGRESQL_DATABASE=mydb
    ports:
      - "5432:5432"

  # --- DATABASE SLAVE ---
  pg-slave:
    image: bitnami/postgresql:latest
    depends_on:
      - pg-master
    environment:
      - POSTGRESQL_REPLICATION_MODE=slave
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      - POSTGRESQL_MASTER_HOST=pg-master
      - POSTGRESQL_MASTER_PORT_NUMBER=5432
      - POSTGRESQL_USERNAME=myuser
      - POSTGRESQL_PASSWORD=mypassword
    ports:
      - "5433:5432"

  # --- API NODE 1 ---
  api_node_1:
    build: ./api
    depends_on:
      - pg-master
      - pg-slave
    environment:
      - ConnectionStrings__MasterDb=Host=pg-master;Port=5432;Database=mydb;Username=myuser;Password=mypassword;
      - ConnectionStrings__SlaveDb=Host=pg-slave;Port=5432;Database=mydb;Username=myuser;Password=mypassword;

  # --- API NODE 2 ---
  api_node_2:
    build: ./api
    depends_on:
      - pg-master
      - pg-slave
    environment:
      - ConnectionStrings__MasterDb=Host=pg-master;Port=5432;Database=mydb;Username=myuser;Password=mypassword;
      - ConnectionStrings__SlaveDb=Host=pg-slave;Port=5432;Database=mydb;Username=myuser;Password=mypassword;

  # --- LOAD BALANCER ---
  nginx_lb:
    image: nginx:latest
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:80"
    depends_on:
      - api_node_1
      - api_node_2
